packages:
  - 'apps/*'
  - 'packages/*'
  - 'eval'

# One version per tool across the repo. Reference with "catalog:".
catalog:
  '@eslint/js': ^10.0.1
  '@types/node': ^24.19.2
  '@vitest/coverage-v8': ^5.0.5
  eslint: ^10.13.0
  eslint-config-prettier: ^10.1.8
  prettier: ^3.9.10
  # typescript-eslint supports typescript <6.1, so stay on 6.0.x
  typescript: ~6.0.3
  typescript-eslint: ^8.72.1
  # @vitest/coverage-v8 peers on this exact version, so bump them together
  vitest: ^5.0.5
  zod: ^4.6.7
  # UI (apps/ui)
  '@tailwindcss/vite': ^4.3.3
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.1.2
  react: ^19.3.1
  react-dom: ^19.3.1
  tailwindcss: ^4.3.3
  # vitest 5 pulls in vite 8, keep them in step
  vite: ^8.3.5
