packages:
  - 'apps/*'
  - 'packages/*'
  - 'eval'

# One version per tool across the repo. Reference with "catalog:".
catalog:
  '@eslint/js': ^10.0.1
  '@types/node': ^26.6.5
  '@vitest/coverage-v8': ^5.1.0
  eslint: ^10.14.0
  eslint-config-prettier: ^10.1.8
  prettier: ^3.9.10
  # typescript-eslint supports typescript <6.1, so stay on 6.0.x
  typescript: ~6.0.3
  typescript-eslint: ^8.72.1
  # @vitest/coverage-v8 peers on this exact version, so bump them together
  vitest: ^5.1.0
  zod: ^4.6.7
  # Postgres client and logging (toolkit, orchestrator, node, demo-app)
  '@types/pg': ^8.23.1
  pg: ^8.23.1
  pino: ^10.4.0
  # Job queue (orchestrator sends fix jobs, node claims them)
  pg-boss: ^12.38.1
  # Live events between the orchestrator, the node daemon and the UI; keep them in step
  socket.io: ^4.8.4
  socket.io-client: ^4.8.4
  # UI (apps/ui)
  '@tailwindcss/vite': ^4.3.5
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.2.1
  react: ^19.3.1
  react-dom: ^19.3.1
  lucide-react: ^1.71.0
  tailwindcss: ^4.3.5
  # vitest 5 pulls in vite 8, keep them in step
  vite: ^8.3.6

# Dependency install scripts pnpm may run. core-js (via posthog-js) only prints a banner.
allowBuilds:
  core-js: false

# GHSA-g3hv-75wg-m249 (minimatch ReDoS) is fixed only in 11.0.1+, but these four still ask for
# ^10 in their latest releases. Scoped to them, so a new dependency that needs minimatch 10
# (11 drops makeRe) isn't forced onto 11, and pinned to the version that was tested.
# Drop each entry once its parent depends on ^11.
overrides:
  'eslint>minimatch': 11.0.5
  '@eslint/config-array>minimatch': 11.0.5
  '@typescript-eslint/typescript-estree>minimatch': 11.0.5
  '@ts-morph/common>minimatch': 11.0.5
