# Dependabot version updates. PR titles come from the commit message and must
# pass commitlint (config-conventional), see .github/workflows/pr-title.yml.
version: 2
updates:
  - package-ecosystem: github-actions
    # "/" only scans .github/workflows and a root action.yml, so the composite
    # actions under .github/actions need their own entry.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    # Wait for a new release to settle before proposing it. Security updates aren't delayed.
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: npm
    # pnpm workspace root: package.json, pnpm-lock.yaml and the catalog in
    # pnpm-workspace.yaml.
    directory: /
    schedule:
      interval: weekly
    # Wait for a new release to settle before proposing it, longer for majors (rewrites like
    # minimatch 11 ship patch after patch at first). Security updates aren't delayed.
    cooldown:
      default-days: 5
      semver-major-days: 14
    # Raise the range (e.g. ^1.0.0 -> ^1.4.0) instead of only moving the
    # lockfile. Lockfile-only updates of catalog entries can fail with
    # NoChangeError (dependabot/dependabot-core#16722).
    versioning-strategy: increase
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore
      include: scope
