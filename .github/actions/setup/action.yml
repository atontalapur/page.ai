name: Setup
description: pnpm (version from packageManager), Node from .nvmrc, cached store, frozen install

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      with:
        cache: true
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
    - run: pnpm install --frozen-lockfile
      shell: bash
