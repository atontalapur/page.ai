name: Setup
description: pnpm (version from packageManager), Node from .nvmrc, cached store, frozen install

inputs:
  filter:
    description: Install only this workspace project (pnpm --filter). Empty installs everything.
    default: ''

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        cache: true
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
    - run: pnpm install --frozen-lockfile ${FILTER:+--filter "$FILTER"}
      shell: bash
      env:
        FILTER: ${{ inputs.filter }}
