# Nightly eval (#15): plays the first 10 dev scenarios from eval/split.json under the full
# ladder with a real model, capped at $1, and commits the results JSON to the
# eval/nightly-results branch (main is protected). Held-out scenarios never run here.
# Needs the OPENROUTER_API_KEY secret and the OPENROUTER_MODEL variable.
# Not a required check.
name: Eval nightly

on:
  schedule:
    # 2 a.m. Pacific (standard time).
    - cron: '0 10 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  IMAGE: page-sandbox:${{ github.sha }}
  RESULTS_BRANCH: eval/nightly-results

jobs:
  eval:
    runs-on: ubuntu-latest
    # Ten scenarios, up to three tiers each. Most attempts take a few minutes.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - name: Check the model settings
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: |
          [ -n "$OPENROUTER_API_KEY" ] || { echo "::error::OPENROUTER_API_KEY secret is not set"; exit 1; }
          [ -n "$OPENROUTER_MODEL" ] || { echo "::error::OPENROUTER_MODEL variable is not set"; exit 1; }
      - uses: ./.github/actions/setup
        with:
          filter: '@page/eval...'
      - uses: docker/setup-buildx-action@v4
      # Same cache scope as sandbox-image.yml, so an unchanged demo app builds from cache.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/sandbox/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=sandbox
      - name: Run the eval
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: >
          pnpm eval:run "$IMAGE" --config ladder --set dev --limit 10 --max-cost 1
          --out "$RUNNER_TEMP/results"
      - name: Commit the results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          if git fetch --depth 1 origin "$RESULTS_BRANCH"; then
            git switch -c results FETCH_HEAD
          else
            # First night: start the branch from the commit that was evaluated.
            git switch -c results
          fi
          mkdir -p eval/results
          cp "$RUNNER_TEMP"/results/*.json eval/results/
          git add eval/results
          git commit -m "chore(eval): nightly results $(date -u +%F)"
          git push origin "HEAD:$RESULTS_BRANCH"
