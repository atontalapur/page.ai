# `pr-title` is a required status check on main (see #36). Squash merges use the PR
# title as the commit subject, so it has to pass commitlint like any other commit.
# Kept out of ci.yml so editing a title doesn't rerun the whole suite.
# Every event lints the current title, body-only edits included: a skipped required check
# counts as passing, so skipping edits let a failing title pass (#99). Each run reads the
# title from its own payload, so the newest run always lints the current one; cancelling
# older runs is safe because nothing skips the newest.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # commitlint is a root devDependency, so skip the rest of the workspace.
      - uses: ./.github/actions/setup
        with:
          filter: page-ai
      # Call the binary directly: `pnpm exec` would see the partial install and install
      # the whole workspace. Pass the title through env, never inline it into the script.
      - run: printf '%s\n' "$TITLE" | node_modules/.bin/commitlint --verbose
        env:
          TITLE: ${{ github.event.pull_request.title }}
