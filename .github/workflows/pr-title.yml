# `pr-title` is a required status check on main (see #36). Squash merges use the PR
# title as the commit subject, so it has to pass commitlint like any other commit.
# Kept out of ci.yml so editing a title doesn't rerun the whole suite.
# Every event lints the current title, body-only edits included: a skipped required check
# counts as passing, so skipping edits let a failing title pass (#99). Each run reads the
# title from the API when it runs, not from its event payload, so the newest run and any
# re-run of an older one lint the current title. Cancelling older runs is safe because
# nothing skips the newest.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # commitlint is a root devDependency, so skip the rest of the workspace. A filtered
      # install also skips the store cache: fetching its ~130 packages beats restoring 230 MB.
      - uses: ./.github/actions/setup
        with:
          filter: page-ai
      # Call the binary directly: `pnpm exec` would see the partial install and install
      # the whole workspace. Pass the title through env, never inline it into the script.
      - run: |
          title="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title --jq .title)"
          printf '%s\n' "$title" | node_modules/.bin/commitlint --verbose
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
