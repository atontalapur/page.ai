# Self-tests seeded bug scenarios (#6). A code scenario (Tier 1 and 2) runs in the sandbox
# image: check.sh passes on the clean demo app, fails after break.sh and passes after
# reference_fix.patch. An ops scenario (Tier 3) runs against the compose demo app: check.sh
# passes, fails after break-ops.sh and passes after fix-ops.sh.
# A PR that changes only scenarios/ self-tests the scenarios it touches. Any other input
# (the runner, the demo app, the sandbox image) and every push to main self-tests all of
# them, and a PR that touches none of the inputs below runs no shards. `selftest` is a
# required check on main that sums up the shards; renaming it breaks the ruleset.
# The code scenarios split by estimated cost into parallel shards, each building the image
# from the warm cache; the ops scenarios get one shard of their own, the only one that starts
# the compose app and the only one that skips the image build.
# Not a required check: it only runs when its inputs change.
name: Scenarios

on:
  pull_request:
  push:
    branches: [main]
    # sandbox-image.yml's inputs (what the scenarios run against), plus the scenarios and
    # the runner. pick checks PRs against the same list.
    paths:
      - scenarios/**
      - eval/**
      - packages/contracts/**
      - infra/sandbox/**
      - apps/demo-app/**
      - packages/config/**
      - apps/node/src/sandbox/**
      - apps/node/scripts/sandbox-run.ts
      - apps/node/package.json
      - .dockerignore
      - .gitignore
      - .nvmrc
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - docker-compose.yml
      - .github/workflows/scenarios.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: page-sandbox:${{ github.sha }}

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.pick.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Pick scenarios
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          # Seconds of scenarios per code shard to aim for, and the most code shards.
          BUDGET: 70
          MAX_SHARDS: 10
          INPUTS: |
            ^scenarios/
            ^eval/
            ^packages/contracts/
            ^infra/sandbox/
            ^apps/demo-app/
            ^packages/config/
            ^apps/node/src/sandbox/
            ^apps/node/scripts/sandbox-run\.ts$
            ^apps/node/package\.json$
            ^\.dockerignore$
            ^\.gitignore$
            ^\.nvmrc$
            ^package\.json$
            ^pnpm-lock\.yaml$
            ^pnpm-workspace\.yaml$
            ^docker-compose\.yml$
            ^\.github/workflows/scenarios\.yml$
        run: |
          all="$(find scenarios -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)"
          if [ "$EVENT" != pull_request ]; then
            ids="$all"
          else
            # Only files the scenarios depend on count; blank pattern lines would match all.
            changed="$(git diff --name-only "$BASE"...HEAD | grep -E -f <(grep -v '^$' <<<"$INPUTS") || true)"
            # Anything outside a scenario's own directory can break every scenario: the
            # runner, the demo app, and the shared scripts at the top of scenarios/ (ops.sh,
            # compose-deploy.sh) that ops scenarios source. So this needs no second copy of
            # the trigger list.
            if [ -z "$changed" ]; then
              ids=""
            elif grep -qvE '^scenarios/[^/]+/' <<<"$changed"; then
              ids="$all"
            else
              # Directories the PR touched that still exist (a deleted scenario has nothing to test).
              ids="$(grep -oP '^scenarios/\K[^/]+(?=/)' <<<"$changed" | sort -u | grep -xF -f <(echo "$all") || true)"
            fi
          fi
          # Ops scenarios (Tier 3) need the live compose app; a break-ops.sh marks one. A code
          # scenario whose check runs on PGlite (node --liftoff-only, see scenarios/README.md)
          # takes ~31s to self-test, any other a few seconds.
          ops="$(for id in $ids; do [ -e "scenarios/$id/break-ops.sh" ] && echo "$id"; done || true)"
          code="$(for id in $ids; do
            [ -e "scenarios/$id/break-ops.sh" ] && continue
            if grep -qs -e --liftoff-only "scenarios/$id/check.sh"; then echo "$id 31"; else echo "$id 3"; fi
          done)"
          echo "Code scenarios, estimated seconds: ${code:-none}"
          echo "Ops scenarios: ${ops:-none}"
          # Enough shards for about BUDGET seconds each, and no two over half of it together.
          # Longest first, each onto the shard with the least so far. No ids, no shards.
          plan="$(jq -cn --arg code "$code" --arg ops "$ops" \
            --argjson budget "$BUDGET" --argjson max "$MAX_SHARDS" '
            ($code | split("\n") | map(select(. != "") | split(" ") | {id: .[0], s: (.[1] | tonumber)})) as $c
            | ($ops | split("\n") | map(select(. != "")) | join(" ")) as $ops
            | ([$max, ($c | length), ([1, ($c | map(.s) | (add // 0) / $budget | ceil),
                ($c | map(select(.s > $budget / 2)) | length)] | max)] | min) as $k
            | (reduce ($c | sort_by(-.s, .id))[] as $x ([range($k) | {s: 0, ids: []}];
                (to_entries | min_by(.value.s) | .key) as $i
                | .[$i].s += $x.s | .[$i].ids += [$x.id])) as $bins
            | [$bins | to_entries[] | {
                name: "code \(.key + 1) of \($k)",
                ops: false,
                ids: (.value.ids | sort | join(" ")),
                est: .value.s
              }]
              + if $ops == "" then [] else [{name: "ops", ops: true, ids: $ops}] end')"
          jq -r '.[] | "\(.name): \(.ids)" + if .est then " (~\(.est)s)" else "" end' <<<"$plan"
          shards="$(jq -c 'map(del(.est))' <<<"$plan")"
          echo "Shards: $shards"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

  shard:
    needs: pick
    if: needs.pick.outputs.shards != '[]'
    name: selftest ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pick.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The ops self-test drives the ops API, so the app gets a throwaway secret for this
      # run. Setting DEMO_APP_URL and OPS_SECRET sends ops scenarios down that path.
      # The app builds and starts in the background while pnpm installs. It builds on the
      # default builder, not from the gha cache: 024's bad deploy build (compose-deploy.sh)
      # reuses its dependency layer there.
      - if: matrix.ops
        name: Start the compose demo app
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "OPS_SECRET=$secret" >> "$GITHUB_ENV"
          echo "DEMO_APP_URL=http://localhost:3000" >> "$GITHUB_ENV"
          # bash -e would end the subshell on a failed start before it writes the status.
          (
            status=0
            OPS_SECRET="$secret" docker compose up -d --build --wait demo-app || status=$?
            echo "$status" > "$RUNNER_TEMP/compose.tmp"
            mv "$RUNNER_TEMP/compose.tmp" "$RUNNER_TEMP/compose.exit"
          ) > "$RUNNER_TEMP/compose.log" 2>&1 &
      - uses: ./.github/actions/setup
        with:
          filter: '@page/eval...'
      - if: matrix.ops
        name: Wait for the compose demo app
        timeout-minutes: 10
        run: |
          until [ -e "$RUNNER_TEMP/compose.exit" ]; do sleep 1; done
          cat "$RUNNER_TEMP/compose.log"
          exit "$(cat "$RUNNER_TEMP/compose.exit")"
      - if: '!matrix.ops'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Hosted runners are thrown away, and removing the builder takes ~15s.
          cleanup: false
      # Same cache scope as sandbox-image.yml, so an unchanged demo app builds from cache.
      - if: '!matrix.ops'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/sandbox/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=sandbox
      - env:
          IDS: ${{ matrix.ids }}
        # One argument per scenario id. Named ids make an ops scenario fail, not skip, if the
        # app above didn't start. The ops shard never builds IMAGE: ops scenarios run on the
        # host, so the runner doesn't use it.
        run: |
          read -ra ids <<<"$IDS"
          pnpm scenarios:selftest "$IMAGE" "${ids[@]}"
      - if: failure() && matrix.ops
        name: Demo app logs
        run: docker compose logs --no-color --tail 200 demo-app demo-app-migrate

  # The one stable name for the ruleset: shard names change with the shard count. Passes when
  # every shard passed or none were needed, fails if pick or any shard failed or was cancelled.
  selftest:
    needs: [pick, shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          PICK: ${{ needs.pick.result }}
          SHARD: ${{ needs.shard.result }}
        run: |
          echo "pick: $PICK, shards: $SHARD"
          [ "$PICK" = success ] && { [ "$SHARD" = success ] || [ "$SHARD" = skipped ]; }
