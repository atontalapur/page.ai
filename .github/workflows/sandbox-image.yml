# Builds the agent sandbox image (#5), runs infra/sandbox/smoke.sh against it, and on main
# pushes it to GHCR. Not a required check: it only runs when the image's inputs change.
name: Sandbox image

on:
  pull_request:
    paths: &inputs
      - infra/sandbox/**
      - apps/demo-app/**
      - packages/config/**
      - apps/node/src/sandbox/**
      - apps/node/scripts/sandbox-run.ts
      - apps/node/package.json
      - .dockerignore
      - .gitignore
      - .nvmrc
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/sandbox-image.yml
  push:
    branches: [main]
    paths: *inputs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}/sandbox

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # smoke.sh starts the container through apps/node/scripts/sandbox-run.ts, which needs
      # only Node itself, so no pnpm install.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/sandbox/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,scope=sandbox,mode=max
      - run: infra/sandbox/smoke.sh "$IMAGE:$GITHUB_SHA"
      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push'
        run: |
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
