# Local Postgres for development and integration tests, plus the demo app.
# `pnpm db:up` starts only Postgres; connection string is in .env.example.
# `docker compose up` also builds and serves the demo app on DEMO_APP_PORT (default 3000).
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: page
      POSTGRES_PASSWORD: page
      POSTGRES_DB: page
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    # Postgres 18+ keeps data in a versioned subdirectory, so mount the parent.
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U page -d page']
      interval: 2s
      timeout: 5s
      retries: 15

  # Migrates and seeds once, then exits. Kept apart from demo-app so an ops restart
  # (POST /api/ops/restart) brings back only the server and doesn't reseed stock.
  demo-app-migrate:
    build:
      context: .
      dockerfile: apps/demo-app/Dockerfile
    image: page-demo-app
    environment:
      # Own database on the shared server; `db.ts migrate` creates it on first run.
      DATABASE_URL: postgres://page:page@postgres:5432/demo
    command: sh -c "node scripts/db.ts migrate && node scripts/db.ts seed"
    depends_on:
      postgres:
        condition: service_healthy

  demo-app:
    image: page-demo-app
    environment:
      DATABASE_URL: postgres://page:page@postgres:5432/demo
      # Turns on the ops API (#13). Set it to 32+ characters to try config and restart.
      OPS_SECRET: ${OPS_SECRET:-}
    # POST /api/ops/restart exits and relies on this to come back, as on Railway.
    restart: unless-stopped
    command: node_modules/.bin/next start
    ports:
      - '${DEMO_APP_PORT:-3000}:3000'
    depends_on:
      demo-app-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
